<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HJ전자 발표 영상 스튜디오</title>
<link rel="icon" href="/assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" id="font-base">
<style>
/* Layout: fixed 1920x1080 stage scaled to fit, player + voice/text editing panel underneath. One deliberate look (brand red on warm white). */
:root{
  --red:#E0262F; --red-deep:#B5161F; --red-soft:#FDECEC;
  --ink:#1B1516; --muted:#6B5F61; --line:#EADFE0; --paper:#FFFFFF; --warm:#FBF6F5;
  --ok:#1F7A4D; --ok-soft:#E3F3EA; --gray:#8E8486; --gray-soft:#F1EEEE;
  --chrome:#151213; --chrome-2:#221D1E; --chrome-3:#2E2729; --chrome-ink:#EFE7E7; --chrome-muted:#A99C9E;
  --font:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--chrome);color:var(--chrome-ink);font-family:var(--font)}
body{margin:0;word-break:keep-all;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.player{max-width:1200px;margin:0 auto;display:grid;gap:14px}
.viewport{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:10px;background:#000}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font);letter-spacing:-.01em}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.scene.on{visibility:visible}
.bg-red{background:var(--red);color:#fff}.bg-white{background:var(--paper)}.bg-warm{background:var(--warm)}
.pos{position:absolute}
.eyebrow{font-size:28px;font-weight:700;color:var(--red);letter-spacing:.01em}
.bg-red .eyebrow{color:rgba(255,255,255,.8)}
.big{font-size:72px;font-weight:900;line-height:1.25;letter-spacing:-.03em;white-space:pre-line}
.h{font-size:60px;font-weight:900;line-height:1.25;letter-spacing:-.03em;white-space:pre-line}
.sub{font-size:28px;font-weight:500;line-height:1.6;color:var(--muted);white-space:pre-line}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;font-size:24px;font-weight:700}
.chip.p{background:var(--red-soft);color:var(--red-deep)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.g{background:var(--gray-soft);color:var(--muted)}
.chip.solid{background:var(--red);color:#fff}
.ico{width:1em;height:1em;flex:none}
.cardx{background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 30px 60px -32px rgba(80,20,25,.28)}

/* generic "other website" mocks: neutral gray, no brand */
.other{background:#F6F6F6;border:1px solid #E2E2E2;border-radius:24px;padding:30px;color:#3A3A3A}
.other .lb{font-size:18px;color:#8A8A8A;margin-bottom:8px}
.ofield{border:2px solid #CFCFCF;border-radius:10px;height:64px;padding:0 18px;display:flex;align-items:center;background:#fff;font-size:30px;letter-spacing:5px}
.ofield.err{border-color:#E0262F}
.oerr{display:flex;align-items:center;gap:8px;color:#D62828;font-size:22px;font-weight:700;margin-top:12px;min-height:30px}
.omsg{font-size:34px;font-weight:700;color:#555}
.obtn{display:inline-flex;align-items:center;justify-content:center;height:58px;padding:0 40px;border-radius:8px;background:#9A9A9A;color:#fff;font-size:22px;font-weight:700}
.siteby{position:absolute;top:-16px;left:28px;background:#6E6E6E;color:#fff;font-size:17px;font-weight:700;padding:6px 14px;border-radius:999px}

/* problem cards (intro) */
.pcard{position:absolute;width:520px;height:470px;border-radius:30px;padding:34px;display:flex;flex-direction:column}
.pcard .num{font-size:22px;font-weight:900;color:var(--red);letter-spacing:.04em}
.pcard .tt{font-size:34px;font-weight:900;line-height:1.3;margin-top:10px;white-space:pre-line}
.pcard .art{flex:1;display:flex;align-items:center;justify-content:center;margin-top:18px}
.pcard.before{background:#fff;border:1px solid var(--line)}
.flipok{position:absolute;inset:0;border-radius:30px;background:#fff;border:3px solid var(--ok);padding:34px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.flipok .ck{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.flipok .ck svg{width:46px;height:46px}
.flipok .tt{color:var(--ink)}

/* browser window with real screenshots */
.win{position:absolute;border-radius:22px;background:#fff;box-shadow:0 40px 80px -30px rgba(60,10,15,.35),0 0 0 1px rgba(0,0,0,.06);overflow:hidden}
.wbar{height:46px;background:#F2EFEF;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid #E5DFE0}
.wbar i{width:13px;height:13px;border-radius:50%;background:#D9D2D3;display:block}
.wbar .url{margin-left:18px;flex:1;height:28px;border-radius:8px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--muted)}
.wvp{position:relative;overflow:hidden}
.cam{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
.cam img{position:absolute;inset:0;width:1440px;height:900px;display:block}
.hl{position:absolute;border:4px solid var(--red);border-radius:14px;box-shadow:0 0 0 9999px rgba(20,10,12,.0);opacity:0;pointer-events:none}
.hl.ok{border-color:var(--ok)}
.cursor{position:absolute;width:34px;height:34px;opacity:0;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.ripple{position:absolute;width:60px;height:60px;border-radius:50%;border:4px solid var(--red);opacity:0;pointer-events:none}
.bubble{position:absolute;padding:14px 22px;border-radius:16px;background:var(--ink);color:#fff;font-size:26px;font-weight:700;white-space:nowrap;opacity:0;box-shadow:0 14px 30px -12px rgba(0,0,0,.45)}
.bubble.ok{background:var(--ok)}.bubble.red{background:var(--red)}
.bubble svg{width:24px;height:24px;vertical-align:-4px;margin-right:8px}

.backend{display:grid;gap:16px;margin-top:34px}
.backend .hd{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;color:var(--muted)}
.bitem{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 22px;font-size:26px;font-weight:700}
.bitem .ic{width:48px;height:48px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.bitem .ic svg{width:26px;height:26px}
.bitem small{display:block;font-size:19px;font-weight:500;color:var(--muted);margin-top:2px}

.steps{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:14px;background:var(--gray-soft);font-size:24px;font-weight:700;color:#555}
.step b{width:34px;height:34px;border-radius:50%;background:#8E8486;color:#fff;display:grid;place-items:center;font-size:18px}
.step.hj{background:var(--red-soft);color:var(--red-deep)}.step.hj b{background:var(--red)}
.counter{display:flex;align-items:baseline;gap:16px}
.counter .n{font-size:120px;font-weight:900;line-height:1;color:var(--red)}
.counter .n.old{color:#B9AEB0;text-decoration:line-through;text-decoration-thickness:8px;font-size:84px}

.subs{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:1500px;padding:14px 28px;border-radius:14px;background:rgba(20,14,15,.78);color:#fff;font-size:31px;font-weight:500;line-height:1.42;text-align:center;z-index:50;white-space:pre-line}
.subs:empty{display:none}
.subs.off{display:none}

/* player chrome */
.bar-ui{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cbtn{height:40px;padding:0 14px;border-radius:10px;border:1px solid #3A3234;background:var(--chrome-2);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.cbtn:hover{border-color:#6A5D60}
.cbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.time{font-size:13px;color:var(--chrome-muted);font-variant-numeric:tabular-nums;margin-left:auto}
.scrub{width:100%;accent-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #3A3234;background:transparent;color:var(--chrome-muted)}
.chips button.cur{border-color:var(--red);color:#fff}
.panel{background:var(--chrome-2);border:1px solid #3A3234;border-radius:12px;padding:16px;display:grid;gap:12px}
.panel h2{font-size:15px;margin:0}
.panel p{font-size:13px;color:var(--chrome-muted);margin:0;line-height:1.6}
.vrows{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--chrome-3)}
.vrow .nm{font-weight:700}
.vrow .st{color:var(--chrome-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow label.cbtn{height:32px;font-size:12px}
.vrow input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.mix{display:flex;flex-wrap:wrap;gap:18px;align-items:center;font-size:13px;color:var(--chrome-muted)}
.mix input[type=range]{accent-color:var(--red);width:140px}
.editing [data-t]{outline:2px dashed rgba(255,214,0,.9);outline-offset:6px;border-radius:6px;cursor:text}
@media (max-width:640px){.vrow{grid-template-columns:1fr auto}.vrow .st{grid-column:1/-1}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row h2{margin-right:auto}
.inp{height:40px;border-radius:10px;border:1px solid #3A3234;background:var(--chrome-3);padding:0 12px;font-size:14px;color:var(--chrome-ink)}
select.inp{padding-right:28px}
.state{font-size:13px;color:var(--chrome-muted)}
.state.err{color:#FF8A80}.state.ok{color:#7FD3A2}
.cbtn.primary{background:var(--red);border-color:var(--red);color:#fff}
.cbtn.rec{border-color:#FF6B6B;color:#FFB4B4}
.cbtn.rec.on{background:#C62828;color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
.vrow{grid-template-columns:170px minmax(0,1fr) auto}
.vrow .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.vrow textarea{grid-column:1/-1;width:100%;min-height:52px;resize:vertical;border-radius:8px;border:1px solid #3A3234;background:#1A1617;color:var(--chrome-ink);font:inherit;font-size:13px;padding:8px 10px;line-height:1.5}
.vrow .warn{grid-column:1/-1;font-size:12px;color:#F5C26B}
a.dl{color:#fff;font-weight:700}
body.export{padding:0;background:#000}
body.export .player{max-width:none;gap:0}
body.export .viewport{width:1920px;height:1080px;border-radius:0;aspect-ratio:auto}
body.export .ui{display:none}
</style>

</head>

<div class="player">
  <div class="viewport" id="vp"><div class="stage" id="stage"></div></div>
  <div class="ui">
    <input class="scrub" id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="재생 위치">
    <div class="bar-ui">
      <button class="cbtn" id="play">재생</button>
      <button class="cbtn" id="prev">이전 장면</button>
      <button class="cbtn" id="next">다음 장면</button>
      <button class="cbtn on" id="subBtn" aria-pressed="true">자막 켜짐</button>
      <button class="cbtn" id="edit" aria-pressed="false">텍스트 편집</button>
      <button class="cbtn" id="reset">원래 문구로</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="panel">
      <div class="row"><h2>프로젝트 저장 · 영상 만들기</h2>
        <input class="inp" id="editKey" type="password" placeholder="편집 비밀번호" autocomplete="current-password" style="width:150px">
        <button class="cbtn" id="saveBtn">저장</button>
        <button class="cbtn primary" id="renderBtn">MP4 만들기</button></div>
      <p><span class="state" id="saveState">불러오는 중…</span> <span class="state" id="renderState"></span></p>
    </div>
    <div class="panel">
      <h2>폰트</h2>
      <div class="mix">
        <select class="inp" id="fontSel" aria-label="영상 폰트">
          <option value="Noto Sans KR">본고딕 (Noto Sans KR)</option>
          <option value="Pretendard">프리텐다드 (Pretendard)</option>
          <option value="IBM Plex Sans KR">IBM Plex Sans KR</option>
          <option value="Nanum Gothic">나눔고딕</option>
          <option value="Gowun Dodum">고운돋움</option>
          <option value="Do Hyeon">도현</option>
          <option value="__custom">내가 올린 폰트</option>
        </select>
        <label class="cbtn">내 폰트 올리기 (woff2·ttf·otf)<input type="file" id="fontFile" accept=".woff2,.woff,.ttf,.otf" style="position:absolute;width:1px;height:1px;opacity:0"></label>
        <span class="state" id="fontState"></span>
      </div>
    </div>
    <div class="panel">
      <h2>목소리와 자막</h2>
      <p>장면마다 [녹음]으로 바로 녹음하거나 [파일 넣기]로 내 녹음·다른 AI 음성(mp3, m4a, wav, webm)을 넣어요. 녹음이 장면보다 길면 그 장면이 자동으로 늘어나요. 아래 칸은 자막(대본)이에요.</p>
      <div class="mix">
        <label>목소리 <input type="range" id="volV" min="0" max="150" step="1" value="100"></label>
        <label>배경음악 <input type="range" id="volM" min="0" max="100" step="1" value="60"></label>
        <button class="cbtn" id="resetVoice">모두 기본 AI 음성으로</button>
      </div>
      <div class="vrows" id="vrows"></div>
    </div>
  </div>
</div>

<script>
(async function(){
const Q=new URLSearchParams(location.search);
const SLUG=(Q.get('p')||'hj-signup').toLowerCase();
const EXPORT=Q.get('export')==='1';

const WX=740,WY=110,WW=1080,WH=WW*900/1440;     // browser window
function win(key,imgs,url){return `
  <div class="win" id="${key}_win" style="left:${WX}px;top:${WY}px;width:${WW}px">
    <div class="wbar"><i></i><i></i><i></i><div class="url">hj-electronics.store/${url}</div></div>
    <div class="wvp" style="width:${WW}px;height:${WH}px"><div class="cam" id="${key}_cam">

      <svg class="cursor" id="${key}_cur" aria-hidden="true"><use href="#i-cursor"/></svg>
    </div></div></div>`;}
/* camera: focus on a box (page coords) with zoom z; z=1 = whole page */
function camAt(b,z){const s=WW/1440*z;let cx=b?b.x+b.width/2:720,cy=b?b.y+b.height/2:450;
  let tx=WW/2-cx*s,ty=WH/2-cy*s;tx=Math.min(0,Math.max(WW-1440*s,tx));ty=Math.min(0,Math.max(WH-900*s,ty));return {s,tx,ty};}
function camMix(a,b,p){return {s:a.s+(b.s-a.s)*p,tx:a.tx+(b.tx-a.tx)*p,ty:a.ty+(b.ty-a.ty)*p};}
function camSet(el,c){el.style.transform=`translate(${c.tx}px,${c.ty}px) scale(${c.s})`;}
function camPath(el,t,keys){/* keys: [[time,box,zoom],...] */
  let c=camAt(keys[0][1],keys[0][2]);
  for(let i=1;i<keys.length;i++){const p=k(t,keys[i][0],1.1);if(p<=0)break;c=camMix(c,camAt(keys[i][1],keys[i][2]),p);}camSet(el,c);}
function hlAt(el,b,p,pad=10){if(!b){el.style.opacity=0;return;}el.style.left=(b.x-pad)+'px';el.style.top=(b.y-pad)+'px';el.style.width=(b.width+pad*2)+'px';el.style.height=(b.height+pad*2)+'px';
  el.style.opacity=p;el.style.transform=`scale(${1.08-.08*p})`;}
function imgShow(key,name,p){const el=document.querySelector(`#${key}_im_${name}`);if(el)el.style.opacity=p;}
function cursorAt(key,x,y,show){const c=document.getElementById(key+'_cur');c.style.left=x+'px';c.style.top=y+'px';c.style.opacity=show;}
function ripple(key,x,y,t0,t){const r=document.getElementById(key+'_rp');const p=(t-t0)/.6;if(p<0||p>1){r.style.opacity=0;return;}
  r.style.left=(x-30)+'px';r.style.top=(y-30)+'px';r.style.opacity=1-p;r.style.transform=`scale(${.4+p*1.2})`;}
function bubble(el,p){if(!el)return;el.style.opacity=p;el.style.transform=`translateY(${(1-p)*14}px) scale(${.96+.04*p})`;}

/* ===== engine ===== */
const ease=x=>1-Math.pow(1-x,3);
function k(t,s,d){return ease(Math.min(1,Math.max(0,(t-s)/d)));}
function up(el,p,dist=36){if(!el)return;el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dist}px)`;}
function pop(el,p){if(!el)return;const s=p<1?.6+.4*p+Math.sin(p*Math.PI)*.12:1;el.style.opacity=Math.min(1,p*1.6);el.style.transform=`scale(${s})`;}
const FADE=.45;
const stage=document.getElementById('stage');
let starts=[],TOTAL=0;
function layout(){starts=[];TOTAL=0;SCENES.forEach(s=>{s.dur=D[s.id].dur;s.name=D[s.id].name;starts.push(TOTAL);TOTAL+=s.dur;});}
function build(){stage.innerHTML=SCENES.map((s,i)=>`<section class="scene ${s.bg}" data-i="${i}">${s.html}</section>`).join('')+'<div class="subs" id="subs"></div>';fillText();layout();}
function fillText(){stage.querySelectorAll('[data-t]').forEach(el=>{if(document.activeElement!==el)el.textContent=TXT[el.dataset.t]??'';});}
function getter(i){const root=stage.children[i];return id=>root.querySelector('#'+id);}
/* subtitles: sentences of the narration spread over the voice by length */
let SUBS=[];
function makeSubs(){SUBS=DATA.map(s=>{const parts=s.say.split(/(?<=[.?!])\s+/).filter(Boolean);const tot=parts.reduce((a,p)=>a+p.length,0)||1;let acc=0;
  return parts.map(p=>{const a=LEAD+acc/tot*s.vdur;acc+=p.length;return {a,b:LEAD+acc/tot*s.vdur+.25,txt:p};});});}
makeSubs();
let subsOn=P.subtitles!==false;
let cur=0,now=0;
function seek(time){
  time=Math.max(0,Math.min(TOTAL-1e-6,time));
  let i=starts.findIndex((s,j)=>time>=s&&time<s+SCENES[j].dur);if(i<0)i=SCENES.length-1;
  const lt=time-starts[i];
  [...stage.querySelectorAll('.scene')].forEach((sc,j)=>sc.classList.toggle('on',j===i||(j===i-1&&lt<FADE)));
  const sc=stage.children[i];sc.style.opacity=i===0?Math.min(1,lt/FADE):Math.min(1,lt/FADE);sc.style.zIndex=2;
  SCENES[i].draw(lt,getter(i));
  if(i>0&&lt<FADE){const pv=stage.children[i-1];pv.style.opacity=1;pv.style.zIndex=1;SCENES[i-1].draw(SCENES[i-1].dur,getter(i-1));}
  const sub=SUBS[i].find(s=>lt>=s.a&&lt<s.b);const se=document.getElementById('subs');se.textContent=sub?sub.txt:'';se.classList.toggle('off',!subsOn);
  cur=i;now=time;ui();
}
/* ===== audio (player only) ===== */
const voiceSrc={};DATA.forEach((s,i)=>voiceSrc[s.id]=P.voices[s.id]?P.voices[s.id].url:AUD['v'+(i+1)]);
const vEls={};let musicEl=null,volV=P.voiceVolume??1,volM=P.musicVolume??.6;
function audioInit(){if(musicEl)return;musicEl=new Audio(AUD.music);musicEl.loop=false;
  DATA.forEach(s=>{vEls[s.id]=new Audio(voiceSrc[s.id]);});applyVol();}
function applyVol(){if(!musicEl)return;musicEl.volume=Math.min(1,volM*.9);Object.values(vEls).forEach(a=>a.volume=Math.min(1,volV));}
function audioSync(force){if(!musicEl)return;
  if(force||Math.abs(musicEl.currentTime-now)>.3){try{musicEl.currentTime=now;}catch(e){}}
  if(playing&&musicEl.paused)musicEl.play().catch(()=>{});
  DATA.forEach((s,i)=>{const a=vEls[s.id];const off=now-starts[i]-LEAD;const active=playing&&i===cur&&off>=0&&off<(a.duration||s.vdur);
    if(active){if(force||a.paused||Math.abs(a.currentTime-off)>.35){try{a.currentTime=off;}catch(e){}a.play().catch(()=>{});}}
    else if(!a.paused)a.pause();});}
function audioStop(){if(!musicEl)return;musicEl.pause();Object.values(vEls).forEach(a=>a.pause());}
let playing=false,last=0;
function tick(ts){if(!playing)return;const dt=(ts-last)/1000;last=ts;now+=dt;if(now>=TOTAL){now=TOTAL-1e-6;play(false);}seek(now);audioSync(false);if(playing)requestAnimationFrame(tick);}
function play(on){playing=on;$id('play').textContent=on?'일시정지':'재생';
  if(on){audioInit();if(now>=TOTAL-0.05)now=0;last=performance.now();audioSync(true);requestAnimationFrame(tick);}else audioStop();}
function $id(x){return document.getElementById(x)}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function ui(){const sc=$id('scrub');if(!sc)return;if(document.activeElement!==sc)sc.value=Math.round(now/TOTAL*1000);
  $id('time').textContent=fmt(now)+' / '+fmt(TOTAL);$id('chips').querySelectorAll('button').forEach((b,j)=>b.classList.toggle('cur',j===cur));}
function fit(){const s=$id('vp').clientWidth/1920;stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit);
build();fit();
$id('chips').innerHTML=SCENES.map((s,i)=>`<button data-j="${i}">${i+1}. ${s.name}</button>`).join('');
const jump=j=>{seek(starts[j]+(editing?s_end(j):0.001));if(playing)audioSync(true);};
const s_end=j=>SCENES[j].dur-.05;
$id('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)jump(+b.dataset.j);});
$id('play').addEventListener('click',()=>play(!playing));
$id('prev').addEventListener('click',()=>jump(Math.max(0,cur-(now-starts[cur]<.6?1:0))));
$id('next').addEventListener('click',()=>jump(Math.min(SCENES.length-1,cur+1)));
$id('scrub').addEventListener('input',e=>{seek(e.target.value/1000*TOTAL);if(playing)audioSync(true);});
$id('subBtn').addEventListener('click',()=>{subsOn=!subsOn;$id('subBtn').classList.toggle('on',subsOn);$id('subBtn').textContent=subsOn?'자막 켜짐':'자막 꺼짐';$id('subBtn').setAttribute('aria-pressed',String(subsOn));seek(now);});
let editing=false;
$id('edit').addEventListener('click',()=>{editing=!editing;play(false);$id('edit').classList.toggle('on',editing);$id('edit').textContent=editing?'편집 끝내기':'텍스트 편집';$id('edit').setAttribute('aria-pressed',String(editing));
  stage.classList.toggle('editing',editing);stage.querySelectorAll('[data-t]').forEach(el=>el.contentEditable=editing?'plaintext-only':'false');if(editing)seek(starts[cur]+s_end(cur));});
stage.addEventListener('input',e=>{const el=e.target.closest('[data-t]');if(!el)return;TXT[el.dataset.t]=el.innerText;
  stage.querySelectorAll(`[data-t="${el.dataset.t}"]`).forEach(o=>{if(o!==el)o.textContent=TXT[el.dataset.t];});P.texts[el.dataset.t]=TXT[el.dataset.t];dirty();});
$id('reset').addEventListener('click',()=>{TXT=Object.assign({},DEFAULT_TXT);P.texts={};fillText();seek(now);dirty();});
document.addEventListener('keydown',e=>{if(editing||e.target.matches('input,textarea,select'))return;if(e.code==='Space'){e.preventDefault();play(!playing);}});
/* ===== 편집 기능 (저장 · 폰트 · 목소리 · 자막 · MP4 만들기) ===== */
let CFG={storage:'local',needsKey:false};
try{CFG=await fetch('/api/config').then(r=>r.json());}catch(e){}
const keyEl=$id('editKey');
try{keyEl.value=sessionStorage.getItem('studio-key')||'';}catch(e){}
keyEl.addEventListener('input',()=>{try{sessionStorage.setItem('studio-key',keyEl.value);}catch(e){}});
if(!CFG.needsKey)keyEl.hidden=true;
const hdr=(extra={})=>Object.assign({'x-edit-key':keyEl.value||''},extra);
function setState(id,txt,cls=''){const el=$id(id);el.textContent=txt;el.className='state '+cls;}
const storageNote=CFG.storage==='supabase'?'Supabase에 저장돼요':'서버 임시 저장소 사용 중 (Supabase를 연결하면 영구 저장돼요)';
let isDirty=false;
function dirty(){isDirty=true;setState('saveState','저장하지 않은 변경이 있어요 · '+storageNote);}
setState('saveState',(PROJ&&PROJ.updated_at?'마지막 저장 '+new Date(PROJ.updated_at).toLocaleString('ko-KR')+' · ':'')+storageNote,'ok');
async function api(method,url,body,extra){const r=await fetch(url,{method,headers:hdr(extra),body});let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error(j.error||('요청 실패 '+r.status));return j;}
async function save(){P.voiceVolume=volV;P.musicVolume=volM;P.subtitles=subsOn;
  setState('saveState','저장하는 중…');
  try{const row=await api('PUT','/api/projects/'+SLUG,JSON.stringify({data:P}),{'Content-Type':'application/json'});isDirty=false;
    setState('saveState','저장했어요 '+new Date(row.updated_at).toLocaleTimeString('ko-KR')+' · '+storageNote,'ok');return true;}
  catch(e){setState('saveState',e.message,'err');return false;}}
$id('saveBtn').addEventListener('click',save);
addEventListener('beforeunload',e=>{if(isDirty){e.preventDefault();e.returnValue='';}});

/* 장면 길이가 바뀌면 다시 배치 */
function relayout(){applyOverrides();layout();makeSubs();seek(Math.min(now,TOTAL-.01));renderVoiceRows();}

/* --- 폰트 --- */
const FONT_CSS={'Pretendard':'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css',
  'IBM Plex Sans KR':'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap',
  'Nanum Gothic':'https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap',
  'Gowun Dodum':'https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap',
  'Do Hyeon':'https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap'};
async function applyFont(){let fam=P.font||'Noto Sans KR';
  if(fam==='__custom'&&P.fontUrl){let st=document.getElementById('font-custom');if(!st){st=document.createElement('style');st.id='font-custom';document.head.appendChild(st);}
    st.textContent=`@font-face{font-family:"StudioCustom";src:url("${P.fontUrl}");font-display:block}`;fam='StudioCustom';}
  else if(fam==='__custom'){fam='Noto Sans KR';}
  if(FONT_CSS[fam]&&!document.querySelector(`link[data-font="${fam}"]`)){const l=document.createElement('link');l.rel='stylesheet';l.href=FONT_CSS[fam];l.dataset.font=fam;document.head.appendChild(l);
    await new Promise(r=>{l.onload=r;l.onerror=r;});}
  stage.style.fontFamily=`"${fam}","Noto Sans KR","Noto Sans CJK KR",sans-serif`;
  try{await document.fonts.load(`900 40px "${fam}"`);await document.fonts.load(`400 40px "${fam}"`);}catch(e){}
  await document.fonts.ready;seek(now);}
$id('fontSel').value=P.font||'Noto Sans KR';
$id('fontSel').addEventListener('change',async e=>{if(e.target.value==='__custom'&&!P.fontUrl){setState('fontState','먼저 폰트 파일을 올려 주세요','err');e.target.value=P.font||'Noto Sans KR';return;}
  P.font=e.target.value;await applyFont();dirty();setState('fontState','');});
$id('fontFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const ext=(f.name.split('.').pop()||'').toLowerCase();
  setState('fontState','올리는 중…');
  try{const j=await api('POST',`/api/upload?p=${SLUG}&kind=font&ext=${ext}`,f);P.fontUrl=j.url;P.font='__custom';$id('fontSel').value='__custom';await applyFont();dirty();setState('fontState',f.name+' 적용됨','ok');}
  catch(err){setState('fontState',err.message,'err');}e.target.value='';});

/* --- 목소리: 듣기 / 녹음 / 파일 / 기본으로, 자막(대본) 편집 --- */
async function audioDuration(blob){const ctx=new (window.AudioContext||window.webkitAudioContext)();
  try{const buf=await ctx.decodeAudioData(await blob.arrayBuffer());return buf.duration;}finally{ctx.close();}}
const recState={};let recorder=null,recScene=null,recChunks=[];
function rowStatus(s,i){const v=P.voices[s.id];const base=BASE[i];
  const who=v?`${v.name||'내 녹음'} · ${v.dur.toFixed(1)}초`:`기본 AI 음성 · ${base.vdur.toFixed(1)}초`;
  return `${who} / 장면 ${s.dur.toFixed(1)}초`+(s.dur>base.dur?` (기본 ${base.dur}초에서 늘어남)`:'');}
function renderVoiceRows(){$id('vrows').innerHTML=DATA.map((s,i)=>`<div class="vrow" data-row="${s.id}">
  <span class="nm">${i+1}. ${s.name}</span><span class="st">${rowStatus(s,i)}</span>
  <span class="acts"><button class="cbtn" data-listen="${i}" style="height:32px;font-size:12px">듣기</button>
  <button class="cbtn rec${recScene===s.id?' on':''}" data-rec="${s.id}" style="height:32px;font-size:12px">${recScene===s.id?'정지 · 저장':'녹음'}</button>
  <label class="cbtn" style="height:32px;font-size:12px">파일 넣기<input type="file" accept="audio/*" data-file="${s.id}"></label>
  ${P.voices[s.id]?`<button class="cbtn" data-def="${s.id}" style="height:32px;font-size:12px">기본으로</button>`:''}</span>
  <textarea data-say="${s.id}" aria-label="${i+1}번 장면 자막">${s.say.replace(/</g,'&lt;')}</textarea>
  ${recState[s.id]?`<span class="warn">${recState[s.id]}</span>`:''}</div>`).join('');}
renderVoiceRows();
function swapVoice(id,src){voiceSrc[id]=src;if(vEls[id]){vEls[id].pause();vEls[id]=new Audio(src);applyVol();}}
async function uploadVoice(id,blob,name){const ext=(name.split('.').pop()||'webm').toLowerCase().replace('mpeg','mp3');
  recState[id]='올리는 중…';renderVoiceRows();
  try{const dur=await audioDuration(blob);
    const j=await api('POST',`/api/upload?p=${SLUG}&kind=voice&scene=${id}&ext=${ext}`,blob);
    P.voices[id]={url:j.url,dur:Math.round(dur*100)/100,name};swapVoice(id,j.url);delete recState[id];relayout();dirty();}
  catch(e){recState[id]=e.message;renderVoiceRows();}}
$id('vrows').addEventListener('change',e=>{const inp=e.target.closest('input[data-file]');if(!inp||!inp.files[0])return;uploadVoice(inp.dataset.file,inp.files[0],inp.files[0].name);inp.value='';});
$id('vrows').addEventListener('input',e=>{const ta=e.target.closest('textarea[data-say]');if(!ta)return;const id=ta.dataset.say;
  if(ta.value.trim()&&ta.value!==BASE.find(b=>b.id===id).say)P.says[id]=ta.value;else delete P.says[id];applyOverrides();makeSubs();seek(now);dirty();});
$id('vrows').addEventListener('click',async e=>{
  const l=e.target.closest('[data-listen]');if(l){jump(+l.dataset.listen);if(!playing)play(true);return;}
  const d=e.target.closest('[data-def]');if(d){const id=d.dataset.def,i=DATA.findIndex(s=>s.id===id);delete P.voices[id];swapVoice(id,AUD['v'+(i+1)]);relayout();dirty();return;}
  const r=e.target.closest('[data-rec]');if(!r)return;const id=r.dataset.rec;
  if(recorder&&recScene===id){recorder.stop();return;}
  if(recorder){recState[id]='다른 장면을 녹음하는 중이에요';renderVoiceRows();return;}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
    recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recScene=id;recChunks=[];
    recorder.ondataavailable=ev=>{if(ev.data.size)recChunks.push(ev.data);};
    recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const type=recorder.mimeType||'audio/webm';const blob=new Blob(recChunks,{type});
      recorder=null;recScene=null;uploadVoice(id,blob,`녹음.${type.includes('mp4')?'m4a':'webm'}`);};
    recorder.start();delete recState[id];renderVoiceRows();}
  catch(err){recState[id]='마이크를 쓸 수 없어요. 브라우저에서 마이크 권한을 허용해 주세요.';renderVoiceRows();}});
$id('resetVoice').addEventListener('click',()=>{DATA.forEach((s,i)=>{if(P.voices[s.id])swapVoice(s.id,AUD['v'+(i+1)]);});P.voices={};relayout();dirty();});
$id('volV').value=Math.round(volV*100);$id('volM').value=Math.round(volM*100);
$id('volV').addEventListener('input',e=>{volV=e.target.value/100;applyVol();dirty();});
$id('volM').addEventListener('input',e=>{volM=e.target.value/100;applyVol();dirty();});
$id('subBtn').classList.toggle('on',subsOn);$id('subBtn').textContent=subsOn?'자막 켜짐':'자막 꺼짐';
$id('subBtn').addEventListener('click',dirty);

/* --- MP4 만들기 (서버 렌더) --- */
let polling=null;
$id('renderBtn').addEventListener('click',async()=>{if(polling)return;
  if(!(await save()))return;
  setState('renderState','영상 만들기를 시작했어요…');$id('renderBtn').disabled=true;
  try{const {jobId}=await api('POST','/api/render/'+SLUG);
    polling=setInterval(async()=>{try{const j=await fetch('/api/jobs/'+jobId).then(r=>r.json());
      if(j.status==='done'){clearInterval(polling);polling=null;$id('renderBtn').disabled=false;
        $id('renderState').innerHTML=`완성됐어요 · <a class="dl" href="${j.output_url}" target="_blank" rel="noopener">MP4 받기</a>`;$id('renderState').className='state ok';}
      else if(j.status==='failed'){clearInterval(polling);polling=null;$id('renderBtn').disabled=false;setState('renderState','영상 만들기에 실패했어요: '+(j.error||''),'err');}
      else setState('renderState',(j.status==='queued'?'순서를 기다리는 중':'영상 만드는 중')+` · ${j.progress||0}% (2~10분 걸려요)`);}catch(e){}},3000);}
  catch(e){$id('renderBtn').disabled=false;setState('renderState',e.message,'err');}});

/* --- 서버 렌더러용 --- */
window.__video={ready:false,fps:30,seek:t=>seek(t),setSubs:on=>{subsOn=on;seek(now);},
  info:()=>({scenes:SCENES.map((s,i)=>({id:s.id,dur:s.dur,voice:voiceSrc[s.id]})),music:AUD.music,musicVolume:volM,voiceVolume:volV,subtitles:subsOn})};
if(EXPORT){document.body.classList.add('export');stage.style.transform='none';}
await applyFont();
await Promise.all([...document.images].map(im=>im.decode?im.decode().catch(()=>{}):null));
seek(0);
window.__video.ready=true;
})();
</script>
</body>
</html>
